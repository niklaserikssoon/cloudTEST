name: .NET CD Pipeline

on:
  # Triggar denna pipeline enbart när CI-pipelinen har körts klart
  workflow_run:
    workflows: [".NET CI Pipeline"]
    types:
      - completed
  # Tillåter även att vi klickar igång den manuellt via GitHubs gränssnitt
  workflow_dispatch:

env:
  # OBS: Uppdatera detta till det faktiska namnet på ditt nyskapade ACR
  AZURE_CONTAINER_REGISTRY: 'acrcloudnative<din-unika-sträng>'
  CONTAINER_APP_NAME: 'ca-cloudnative-api'
  RESOURCE_GROUP: 'rg-cloudnative-dev'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Körs ENDAST om den föregående CI-pipelinen lyste grönt (success)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
        # Hämtas säkert från GitHub Secrets för att undvika läckage
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: Build and push container image to ACR
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Taggar imagen med Git Commit SHA för total spårbarhet
        tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
        resourceGroup: ${{ env.RESOURCE_GROUP }}
        containerAppName: ${{ env.CONTAINER_APP_NAME }}