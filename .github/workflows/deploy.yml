name: .NET CD Pipeline

on:
  # Triggar denna pipeline enbart n�r CI-pipelinen har k�rts klart
  workflow_run:
    workflows: [".NET CI Pipeline"]
    types:
      - completed
  # Till�ter �ven att vi klickar ig�ng den manuellt via GitHubs gr�nssnitt
  workflow_dispatch:

env:
  # OBS: Uppdatera detta till det faktiska namnet p� ditt nyskapade ACR
  AZURE_CONTAINER_REGISTRY: 'acrstudentfwdvhunj3mx3s'
  CONTAINER_APP_NAME: 'ca-cloudnative-api'
  RESOURCE_GROUP: 'rg-bicep-student2'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # K�rs ENDAST om den f�reg�ende CI-pipelinen lyste gr�nt (success)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
        # H�mtas s�kert fr�n GitHub Secrets f�r att undvika l�ckage
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push container image to ACR
      uses: docker/build-push-action@v6
      with:
        context: ./CloudNativveApp.Api
        file: ./CloudNativveApp.Api/Dockerfile
        push: true
        # Taggar imagen med Git Commit SHA f�r total sp�rbarhet
        tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
        resourceGroup: ${{ env.RESOURCE_GROUP }}
        containerAppName: ${{ env.CONTAINER_APP_NAME }}